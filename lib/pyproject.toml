[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-qradar-connector"
version = "1.0.0"
description = "Conector Ruvic para IBM QRadar: listar ofensas, consultar detalle de ofensa, y actualizar su estado"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_qradar_connector*"]
